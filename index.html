<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#397f94" />
    <title>登录 · 本机核验</title>

    <!-- Tailwind CSS v3 CDN：无需构建即可直接打开 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              travelBlue: "#397f94",
              travelGold: "#edae10",
            },
          },
        },
      };
    </script>

    <style>
      /* ---------- 设计字体 ---------- */
      @font-face {
        font-family: "Hind Jalandhar:Bold";
        src: url("https://static.figma.com/font/HindJalandhar-Bold_1") format("woff2");
        font-style: normal;
        font-weight: 700;
      }
      @font-face {
        font-family: "Hind Jalandhar:Regular";
        src: url("https://static.figma.com/font/HindJalandhar-Regular_1") format("woff2");
        font-style: normal;
        font-weight: 400;
      }
      @font-face {
        font-family: "Hind:Bold";
        src: url("https://static.figma.com/font/Hind-Bold_1") format("woff2");
        font-style: normal;
        font-weight: 700;
      }
      @font-face {
        font-family: "Noto Sans JP:Bold";
        src: url("https://static.figma.com/font/NotoSansJP-VF_2") format("woff2");
        font-style: normal;
        font-weight: 700;
      }
      @font-face {
        font-family: "Noto Sans JP:Medium";
        src: url("https://static.figma.com/font/NotoSansJP-VF_2") format("woff2");
        font-style: normal;
        font-weight: 500;
      }
      @font-face {
        font-family: "Noto Sans JP:Regular";
        src: url("https://static.figma.com/font/NotoSansJP-VF_2") format("woff2");
        font-style: normal;
        font-weight: 400;
      }
      @font-face {
        font-family: "Noto Sans SC:Bold";
        src: url("https://static.figma.com/font/NotoSansSC-VF_2") format("woff2");
        font-style: normal;
        font-weight: 700;
      }
      @font-face {
        font-family: "Noto Sans SC:Medium";
        src: url("https://static.figma.com/font/NotoSansSC-VF_2") format("woff2");
        font-style: normal;
        font-weight: 500;
      }
      @font-face {
        font-family: "Noto Sans SC:Regular";
        src: url("https://static.figma.com/font/NotoSansSC-VF_2") format("woff2");
        font-style: normal;
        font-weight: 400;
      }
      @font-face {
        font-family: "Poppins:Medium";
        src: url("https://static.figma.com/font/Poppins-Medium_6") format("woff2");
        font-style: normal;
        font-weight: 500;
      }
      @font-face {
        font-family: "Roboto:Regular";
        src: url("https://static.figma.com/font/Roboto_wdth_wght__3") format("woff2");
        font-style: normal;
        font-weight: 400;
      }

      /* ---------- 页面基础与手机画布 ---------- */
      :root {
        color-scheme: light;
      }

      html,
      body {
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        background: #eef1f2;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input {
        font: inherit;
      }

      .phone-page {
        position: relative;
        width: min(100vw, 440px);
        min-height: max(100dvh, 956px);
        margin-inline: auto;
        overflow: hidden;
        background: #397f94;
        box-shadow: 0 18px 50px rgba(21, 61, 73, 0.16);
      }

      /* ---------- 分段入场动画 ---------- */
      @keyframes gentle-enter {
        from {
          opacity: 0;
          translate: 0 12px;
        }
        to {
          opacity: 1;
          translate: 0 0;
        }
      }

      @keyframes soft-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(237, 174, 16, 0);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(237, 174, 16, 0.12);
        }
      }

      @keyframes button-loading {
        0% {
          opacity: 0.65;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.65;
        }
      }

      .reveal {
        opacity: 0;
        animation: gentle-enter 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: var(--delay, 0ms);
      }

      /* ---------- 输入框交互 ---------- */
      .input-shell {
        position: absolute;
        left: 10%;
        width: 82.2727%;
        height: 60px;
        overflow: hidden;
        border: 1px solid #b8b8b8;
        border-radius: 9px;
        background: #fff;
        transition:
          border-color 0.55s ease,
          background-color 0.55s ease,
          box-shadow 0.65s ease,
          transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .input-shell::after {
        position: absolute;
        right: 20px;
        bottom: 0;
        left: 20px;
        height: 2px;
        content: "";
        background: #edae10;
        opacity: 0;
        transform: scaleX(0);
        transform-origin: center;
        transition:
          opacity 0.5s ease,
          transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .input-shell:focus-within {
        z-index: 2;
        border-color: #edae10;
        background: #fffefa;
        box-shadow: 0 9px 24px rgba(25, 66, 78, 0.14);
        transform: translateY(-2px);
      }

      .input-shell:focus-within::after,
      .input-shell.has-value::after {
        opacity: 1;
        transform: scaleX(1);
      }

      .input-shell input {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 0 20px;
        color: #414141;
        caret-color: #edae10;
        font-family: "Poppins:Medium", "Noto Sans SC:Medium", sans-serif;
        font-size: 16px;
        font-weight: 500;
        line-height: 23px;
      }

      .input-shell input::placeholder {
        color: #d0d0d0;
        opacity: 1;
        transition: color 0.45s ease;
      }

      .input-shell:focus-within input::placeholder {
        color: #b8b8b8;
      }

      .password-shell input {
        padding-right: 58px;
      }

      .eye-button img {
        transition:
          opacity 0.45s ease,
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .eye-button[aria-pressed="true"] img {
        opacity: 0.58;
        transform: rotate(180deg) scale(0.92);
      }

      /* ---------- 通用触摸 / 悬停反馈 ---------- */
      .pressable {
        transition:
          transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.45s ease,
          box-shadow 0.55s ease,
          background-color 0.45s ease;
        touch-action: manipulation;
      }

      .pressable:active {
        filter: brightness(0.97);
        transform: translateY(1px) scale(0.975);
      }

      @media (hover: hover) {
        .pressable:hover {
          filter: brightness(1.035);
          transform: translateY(-2px);
        }

        .primary-button:hover {
          box-shadow: 0 10px 25px rgba(49, 55, 20, 0.18);
        }

        .social-button:hover {
          border-color: rgba(255, 255, 255, 0.9);
          background: rgba(255, 255, 255, 0.09);
        }
      }

      .primary-button.is-loading {
        animation: button-loading 1.5s ease-in-out infinite;
        pointer-events: none;
      }

      .password-shell.is-typing {
        animation: soft-pulse 1.8s ease-in-out;
      }

      @media (max-width: 439px) {
        .phone-page {
          min-height: max(100dvh, 880px);
          box-shadow: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- 440 × 956：iPhone 16 / 17 Pro Max 设计画布 -->
    <main class="phone-page" aria-labelledby="page-title">
      <!-- 顶部返回与核验状态 -->
      <button
        class="pressable reveal absolute left-[43px] top-[76px] z-10 h-[21px] w-[21px] border-0 bg-transparent p-0"
        style="--delay: 80ms"
        type="button"
        aria-label="返回"
        data-back
      >
        <img class="block h-[21px] w-[21px] rotate-180" src="/assets/614ba.svg" alt="" />
      </button>

      <p
        class="reveal absolute left-1/2 top-[112px] m-0 -translate-x-1/2 whitespace-nowrap text-center text-[20px] font-normal leading-normal text-[#fff8f8]"
        style="
          --delay: 150ms;
          font-family:
            &quot;Hind Jalandhar:Regular&quot;, &quot;Noto Sans SC:Regular&quot;, sans-serif;
        "
      >
        正在完成本机核验
      </p>

      <!-- 标题区 -->
      <h1
        id="page-title"
        class="reveal absolute left-1/2 top-[178px] m-0 -translate-x-1/2 text-center text-[41px] font-bold leading-normal text-white"
        style="
          --delay: 230ms;
          font-family: &quot;Hind Jalandhar:Bold&quot;, &quot;Noto Sans SC:Bold&quot;, sans-serif;
        "
      >
        登录
      </h1>
      <p
        class="reveal absolute left-1/2 top-[249px] m-0 -translate-x-1/2 whitespace-nowrap text-center text-[20px] font-normal leading-normal text-white"
        style="
          --delay: 310ms;
          font-family:
            &quot;Hind Jalandhar:Regular&quot;, &quot;Noto Sans SC:Regular&quot;, sans-serif;
        "
      >
        请填写你的密码
      </p>

      <!-- 登录表单 -->
      <form id="login-form" novalidate>
        <label class="input-shell reveal top-[296px]" style="--delay: 390ms">
          <span class="sr-only">邮箱或手机号</span>
          <input
            id="account"
            name="account"
            type="text"
            inputmode="email"
            autocomplete="username"
            placeholder="邮箱或手机号"
          />
        </label>

        <label class="input-shell password-shell reveal top-[376px]" style="--delay: 470ms">
          <span class="sr-only">密码</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="密码"
          />
          <button
            id="toggle-password"
            class="eye-button pressable absolute right-[14px] top-[18px] z-10 h-6 w-6 border-0 bg-transparent p-0"
            type="button"
            aria-label="显示密码"
            aria-pressed="false"
          >
            <img class="block h-6 w-6 rotate-180" src="/assets/658e5.svg" alt="" />
          </button>
        </label>

        <button
          class="pressable reveal absolute right-[63px] top-[446px] border-0 bg-transparent p-0 text-center text-[14px] font-medium leading-[19px] text-[#f44336]"
          style="
            --delay: 540ms;
            font-family: &quot;Poppins:Medium&quot;, &quot;Noto Sans SC:Medium&quot;, sans-serif;
          "
          type="button"
        >
          忘记密码？
        </button>

        <button
          id="login-button"
          class="primary-button pressable reveal absolute left-[10%] top-[505px] flex h-[54px] w-[82.2727%] items-center justify-center rounded-[8px] border-0 bg-[#edae10] px-6 text-center text-[16px] font-medium leading-[23px] text-white"
          style="
            --delay: 610ms;
            font-family: &quot;Poppins:Medium&quot;, &quot;Noto Sans SC:Medium&quot;, sans-serif;
          "
          type="submit"
        >
          <span>登录</span>
        </button>
      </form>

      <!-- 分隔线 -->
      <div
        class="reveal absolute left-[57px] right-[40px] top-[579px] flex items-center gap-[8px]"
        style="--delay: 690ms"
      >
        <span class="h-px flex-1 bg-[#b8b8b8]"></span>
        <span
          class="w-[23px] text-center text-[16px] font-medium leading-6 text-[#b8b8b8]"
          style="font-family: &quot;Poppins:Medium&quot;, sans-serif"
          >or</span
        >
        <span class="h-px flex-1 bg-[#b8b8b8]"></span>
      </div>

      <!-- 第三方登录 -->
      <div
        class="reveal absolute left-1/2 top-[623px] flex -translate-x-1/2 gap-[15px]"
        style="--delay: 770ms"
      >
        <button
          class="social-button pressable flex h-12 w-12 items-center justify-center rounded-[8px] border-[1.5px] border-[#d0d0d0] bg-transparent p-0"
          type="button"
          aria-label="使用 Gmail 登录"
        >
          <img class="h-6 w-6" src="/assets/dedf7.svg" alt="" />
        </button>
        <button
          class="social-button pressable flex h-12 w-12 items-center justify-center rounded-[8px] border-[1.5px] border-[#d0d0d0] bg-transparent p-0"
          type="button"
          aria-label="使用 Facebook 登录"
        >
          <img class="h-6 w-6" src="/assets/5f772.svg" alt="" />
        </button>
        <button
          class="social-button pressable flex h-12 w-12 items-center justify-center rounded-[8px] border-[1.5px] border-[#d0d0d0] bg-transparent p-0"
          type="button"
          aria-label="使用 Apple 登录"
        >
          <img class="h-6 w-6" src="/assets/2e553.svg" alt="" />
        </button>
      </div>

      <!-- 注册入口 -->
      <p
        class="reveal absolute left-1/2 top-[714px] m-0 -translate-x-1/2 whitespace-nowrap text-center text-[16px] font-medium leading-6 text-[#5a5a5a]"
        style="--delay: 850ms; font-family: &quot;Poppins:Medium&quot;, sans-serif"
      >
        Don’t have an account?
        <button class="pressable border-0 bg-transparent p-0 text-[#edae10]" type="button">
          Sign Up
        </button>
      </p>

      <!-- 底部导航 -->
      <button
        class="pressable reveal absolute left-[57px] top-[780px] flex h-[50px] w-[49px] items-center justify-center rounded-full border-0 bg-[#eeecec] p-0"
        style="--delay: 930ms"
        type="button"
        aria-label="上一步"
        data-back
      >
        <img class="h-4 w-4 rotate-180" src="/assets/aaaed.svg" alt="" />
      </button>

      <button
        class="pressable reveal absolute right-[51px] top-[780px] flex h-[50px] w-[96px] items-center justify-center gap-[10px] rounded-full border-0 bg-[rgba(226,224,224,0.20)] px-4 text-white"
        style="--delay: 1010ms"
        type="button"
        aria-label="下一步"
      >
        <span
          class="whitespace-nowrap text-[16px] font-normal leading-normal"
          style="
            font-family: &quot;Roboto:Regular&quot;, &quot;Noto Sans SC:Regular&quot;, sans-serif;
            font-variation-settings: &quot;wdth&quot; 100;
          "
          >下一步</span
        >
        <img class="h-4 w-4" src="/assets/c3cd7.svg" alt="" />
      </button>

      <p
        id="form-status"
        class="pointer-events-none absolute left-1/2 top-[852px] m-0 -translate-x-1/2 text-center text-[13px] text-white/0 transition-colors duration-700"
        role="status"
        aria-live="polite"
      ></p>
    </main>

    <script>
      // ---------- 必要交互：输入状态、密码显隐与轻量提交反馈 ----------
      const passwordInput = document.querySelector("#password");
      const passwordShell = passwordInput.closest(".password-shell");
      const togglePassword = document.querySelector("#toggle-password");
      const loginForm = document.querySelector("#login-form");
      const loginButton = document.querySelector("#login-button");
      const loginText = loginButton.querySelector("span");
      const formStatus = document.querySelector("#form-status");

      document.querySelectorAll(".input-shell input").forEach((input) => {
        input.addEventListener("input", () => {
          input.closest(".input-shell").classList.toggle("has-value", input.value.length > 0);
        });
      });

      passwordInput.addEventListener("input", () => {
        passwordShell.classList.remove("is-typing");
        requestAnimationFrame(() => passwordShell.classList.add("is-typing"));
      });

      togglePassword.addEventListener("click", () => {
        const willShow = passwordInput.type === "password";
        passwordInput.type = willShow ? "text" : "password";
        togglePassword.setAttribute("aria-pressed", String(willShow));
        togglePassword.setAttribute("aria-label", willShow ? "隐藏密码" : "显示密码");
        passwordInput.focus({ preventScroll: true });
        const end = passwordInput.value.length;
        passwordInput.setSelectionRange(end, end);
      });

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        loginButton.classList.add("is-loading");
        loginText.textContent = "核验中…";
        formStatus.textContent = "正在安全核验登录信息";
        formStatus.classList.remove("text-white/0");
        formStatus.classList.add("text-white/70");

        window.setTimeout(() => {
          loginButton.classList.remove("is-loading");
          loginText.textContent = "登录";
          formStatus.classList.remove("text-white/70");
          formStatus.classList.add("text-white/0");
        }, 1800);
      });

      document.querySelectorAll("[data-back]").forEach((button) => {
        button.addEventListener("click", () => {
          if (window.history.length > 1) window.history.back();
        });
      });
    </script>
  </body>
</html>
