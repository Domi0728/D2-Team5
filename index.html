<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园同路线拼车 · 后端演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#182d42;font:16px/1.65 system-ui,sans-serif}header{background:#122b40;color:white;padding:38px max(5vw,24px)}header p{color:#bcd1df;margin:8px 0}h1{font-size:34px;margin:4px 0}main{max-width:1100px;margin:28px auto;padding:0 24px}.tag{letter-spacing:3px;font-size:12px;color:#79debb}.bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap}button{background:#087f6e;color:white;border:0;border-radius:8px;padding:14px 26px;cursor:pointer;font:inherit;font-weight:600}button:disabled{opacity:.55;cursor:wait}#status{color:#526678}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat,.step{background:white;border:1px solid #dde5eb;border-radius:12px;padding:22px}.stat strong{display:block;font-size:28px;color:#087f6e}.step{margin:14px 0;border-left:5px solid #087f6e}.step h2{font-size:19px;margin:0 0 6px}.badge{background:#e5f6ef;padding:3px 10px;border-radius:20px;color:#17634a;font-size:13px}.meta{color:#526678;font-size:14px}details{margin-top:12px}summary{cursor:pointer;color:#087f6e}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8fa;padding:14px;font-size:12px;max-height:380px;overflow:auto}.note{background:#e7eef5;padding:16px 20px;border-radius:10px;font-size:14px;margin:20px 0}footer{padding:24px;color:#667989;text-align:center}@media(max-width:600px){h1{font-size:25px}.stats{grid-template-columns:1fr}}
</style><header><div class="tag">CAMPUS RIDE / WEEK 06</div><h1>同路线，一起出发</h1><p>校园拼车后端 · 完整业务流程演示</p></header><main><div class="bar"><button id="run">运行完整拼车流程</button><span id="status">准备就绪 · 点击后调用本地 C 后端</span></div><div class="note">这是后端验收演示界面，不是小组正式前端。每次运行使用独立临时数据库和模拟时间，自动创建演示账号，不操作真实用户数据。后端为 C，演示启动脚本为 Python。</div><div class="stats"><div class="stat">完成的流程步骤<strong id="count">—</strong></div><div class="stat">最终行程状态<strong id="state">待运行</strong></div><div class="stat">同行人数（含发起人）<strong id="members">—</strong></div></div><section id="steps"><p>发布行程 → 匹配同伴 → 接受邀请 → 修改与重新确认 → 出发 → 到达 → 历史记录</p></section></main><footer>C11 · SQLite · JSON HTTP API</footer><script>
const $=id=>document.getElementById(id);
const labels={WAITING:'等待同伴',CONFIRMED:'已成团',RECONFIRMATION_REQUIRED:'等待重新确认',IN_PROGRESS:'行程中',COMPLETED:'行程已结束'};
function render(data){$('steps').replaceChildren();data.steps.forEach((step,i)=>{const el=document.createElement('article');el.className='step';const h=document.createElement('h2');h.textContent=String(i+1).padStart(2,'0')+'  '+step.title;el.append(h);const r=step.response;if(r.status&&labels[r.status]){const b=document.createElement('span');b.className='badge';b.textContent=labels[r.status];el.append(b)}if(r.member_count){const p=document.createElement('div');p.className='meta';p.textContent=`成员 ${r.member_count} 人 · 剩余 ${r.available_seats} 座 · 行程版本 ${r.version}`;el.append(p)}const det=document.createElement('details'),sum=document.createElement('summary'),pre=document.createElement('pre');sum.textContent='查看实际接口结果';pre.textContent=JSON.stringify(r,null,2);det.append(sum,pre);el.append(det);$('steps').append(el)});$('count').textContent=data.steps.length;const end=data.steps.find(x=>x.response.status==='COMPLETED').response;$('state').textContent='已结束';$('members').textContent=end.member_count+' 人';}
$('run').onclick=async()=>{$('run').disabled=true;$('status').textContent='正在运行实际 HTTP 流程…';try{const response=await fetch('/run',{method:'POST',headers:{'X-Demo-Request':'1'}});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'请求失败');render(data);$('status').textContent='完整流程通过 · 结果来自本次真实运行';}catch(e){$('status').textContent='运行失败：'+e.message+'。请先启动 python3 tools/demo.py --serve';}finally{$('run').disabled=false}};
</script></html>
